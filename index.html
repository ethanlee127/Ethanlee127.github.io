<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Résumé and projects" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="brand" id="brand"></a>
      <nav id="nav-links" aria-label="Sections"></nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
        <button id="menu-toggle" class="icon-btn menu-btn" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero container" id="hero"></section>
    <section class="container section" id="about"></section>
    <section class="container section" id="skills"></section>
    <section class="container section" id="projects"></section>
    <section class="container section" id="experience"></section>
    <section class="container section" id="education"></section>
    <section class="container section" id="extras"></section>
    <section class="container section" id="contact"></section>
  </main>

  <footer class="footer container" id="footer"></footer>

  <!-- Content first, then the code that renders it -->
  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
